name: Offline Integrity, 7-Gate Suite & Windows x64 Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-web-and-curriculum:
    name: 7-Gate Privacy, Curriculum & DOM Suite (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JavaScript syntax
        run: |
          for f in js/*.js; do node --check "$f"; done

      - name: Run 7-Gate Privacy, Offline & Adaptive Engine Suite
        run: python3 tests/verify_all_gates.py

      - name: Run Full DOM Flow & Benchmark Integration Suite
        run: node tests/verify_dom_app.js

  build-windows-standalone:
    name: Build Native Windows x64 Portable & Installer
    needs: verify-web-and-curriculum
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compile Native x64 WebView2 App, Portable ZIP & Setup EXE
        shell: pwsh
        run: ./desktop/build-windows.ps1

      - name: Smoke-test compiled ZeroToCodeLab.exe & generate SHA256SUMS
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "./dist/ZeroToCode-Systems-Lab-Portable/ZeroToCodeLab.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-check failed with exit code $($p.ExitCode)" }
          $lines = @()
          foreach ($f in @("ZeroToCode-Systems-Lab-Setup-x64.exe", "ZeroToCode-Systems-Lab-Portable-win-x64.zip")) {
            $h = (Get-FileHash -Algorithm SHA256 -LiteralPath "./dist/$f").Hash.ToLowerInvariant()
            $lines += "$h  $f"
          }
          $lines | Set-Content -LiteralPath "./dist/SHA256SUMS.txt" -Encoding ASCII
          Get-Content "./dist/SHA256SUMS.txt"

      - name: Upload Windows Portable & Setup Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroToCode-Systems-Lab-Windows-x64
          path: |
            dist/ZeroToCode-Systems-Lab-Portable-win-x64.zip
            dist/ZeroToCode-Systems-Lab-Setup-x64.exe
            dist/SHA256SUMS.txt

      - name: Publish Standalone Installer & Portable ZIP to GitHub Release v1.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @(
            "## Zero-to-Code Systems Lab v1.0.0 (100% Offline & Privacy-First)",
            "",
            "- **Installer (`ZeroToCode-Systems-Lab-Setup-x64.exe`)**: User-mode Windows x64 installer (no admin required) with Start Menu & Desktop shortcuts.",
            "- **Portable Edition (`ZeroToCode-Systems-Lab-Portable-win-x64.zip`)**: Unzip anywhere (including USB drives) and run `ZeroToCodeLab.exe` — stores all local data self-contained inside `./portable-data/`.",
            "- **Privacy Guarantee**: `0` external network requests (`connect-src 'none'` + native WebView2 air-gap filter), input-scoped keystroke dynamics only.",
            "",
            "### SHA-256 Checksums",
            "```text"
          ) + (Get-Content "./dist/SHA256SUMS.txt") + @("```")
          $notes -join "`n" | Set-Content -LiteralPath "./dist/RELEASE_NOTES.md" -Encoding UTF8
          if (gh release view v1.0.0 2>$null) {
            gh release upload v1.0.0 ./dist/ZeroToCode-Systems-Lab-Setup-x64.exe ./dist/ZeroToCode-Systems-Lab-Portable-win-x64.zip ./dist/SHA256SUMS.txt --clobber
          } else {
            gh release create v1.0.0 ./dist/ZeroToCode-Systems-Lab-Setup-x64.exe ./dist/ZeroToCode-Systems-Lab-Portable-win-x64.zip ./dist/SHA256SUMS.txt --title "v1.0.0 - Standalone Windows x64 Installer & Portable Offline Edition" --notes-file ./dist/RELEASE_NOTES.md
          }
