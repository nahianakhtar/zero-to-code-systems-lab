name: Offline Integrity, 7-Gate Suite & Windows x64 Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-web-and-curriculum:
    name: 7-Gate Privacy, Curriculum & DOM Suite (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JavaScript syntax
        run: |
          for f in js/*.js; do node --check "$f"; done

      - name: Run 7-Gate Privacy, Offline & Adaptive Engine Suite
        run: python3 tests/verify_all_gates.py

      - name: Run Full DOM Flow & Benchmark Integration Suite
        run: node tests/verify_dom_app.js

  build-windows-standalone:
    name: Build Native Windows x64 Portable & Installer
    needs: verify-web-and-curriculum
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compile Native x64 WebView2 App, Portable ZIP & Setup EXE
        shell: pwsh
        run: ./desktop/build-windows.ps1

      - name: Smoke-test compiled ZeroToCodeLab.exe & generate SHA256SUMS
        shell: pwsh
        run: |
          $p = Start-Process -FilePath './dist/ZeroToCode-Systems-Lab-Portable/ZeroToCodeLab.exe' -ArgumentList '--self-check' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-check failed with exit code $($p.ExitCode)" }
          $lines = @()
          foreach ($f in @('ZeroToCode-Systems-Lab-Setup-x64.exe', 'ZeroToCode-Systems-Lab-Portable-win-x64.zip')) {
            $h = (Get-FileHash -Algorithm SHA256 -LiteralPath "./dist/$f").Hash.ToLowerInvariant()
            $lines += "$h  $f"
          }
          $lines | Set-Content -LiteralPath './dist/SHA256SUMS.txt' -Encoding ASCII
          Get-Content './dist/SHA256SUMS.txt'

      - name: Upload Windows Portable & Setup Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroToCode-Systems-Lab-Windows-x64
          path: |
            dist/ZeroToCode-Systems-Lab-Portable-win-x64.zip
            dist/ZeroToCode-Systems-Lab-Setup-x64.exe
            dist/SHA256SUMS.txt

      - name: Publish Standalone Installer & Portable ZIP to GitHub Release v1.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: v1.0.0 - Standalone Windows x64 Installer & Portable Offline Edition
          body: |
            ## Zero-to-Code Systems Lab v1.0.0 (100% Offline & Privacy-First)

            - **Windows x64 Installer (`ZeroToCode-Systems-Lab-Setup-x64.exe`)**: User-mode setup (no admin rights required) with Start Menu and optional Desktop shortcuts plus clean uninstaller.
            - **USB Portable Edition (`ZeroToCode-Systems-Lab-Portable-win-x64.zip`)**: Unzip anywhere and launch `ZeroToCodeLab.exe` directly — stores all WebView2 state and `localStorage` inside `./portable-data/` with zero registry writes.
            - **Strict Air-Gapped Privacy**: `0` external network requests (`connect-src 'none'` + native C# WebView2 `403 Offline Blocked` filter) and input-scoped keystroke dynamics only.
            - **SHA-256 Checksums**: Attached in `SHA256SUMS.txt`.
          files: |
            dist/ZeroToCode-Systems-Lab-Setup-x64.exe
            dist/ZeroToCode-Systems-Lab-Portable-win-x64.zip
            dist/SHA256SUMS.txt
